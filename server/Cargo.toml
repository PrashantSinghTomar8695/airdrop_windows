[package]
name = "airdrop-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
plist = "1.6"
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1.6"
futures = "0.3"
