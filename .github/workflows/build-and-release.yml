name: Build & Package AirDrop Windows

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release'
        type: boolean
        default: false
      version_tag:
        description: 'Release version tag (e.g. v1.0.0)'
        type: string
        default: 'v1.0.0'

jobs:
  build:
    name: Build & Package (.NET 8 WPF)
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Application (Release win-x64)
        run: dotnet publish AirDropWindows.csproj -c Release -r win-x64 --self-contained false -o ./publish

      - name: Compress Build Artifact
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./AirDropWindows-win-x64.zip -Force

      - name: Upload Build Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: AirDropWindows-win-x64
          path: ./AirDropWindows-win-x64.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version_tag }}
          name: AirDrop Windows ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version_tag }}
          files: ./AirDropWindows-win-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
